[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-evidence-engine"
version = "0.1.0"
description = "Compliance-as-code engine that collects audit evidence from engineering systems and maps it to ISO/IEC 27001:2022 controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rudraksh Dixit" }]
keywords = ["grc", "compliance", "iso-27001", "soc2", "audit", "security-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dashboard = ["streamlit>=1.30", "pandas>=2.0", "altair>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cee = "cee.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cee*"]

[tool.setuptools.package-data]
cee = ["frameworks/*.yaml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
